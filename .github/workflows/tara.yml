name: Depo tara

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - name: Aynı aramada sayfaları bitir
        env:
          SCAN_URL: ${{ secrets.SCAN_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SCAN_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "GitHub secret eksik: SCAN_URL ve CRON_SECRET"
            exit 1
          fi
          base="${SCAN_URL%/}"
          for i in $(seq 1 20); do
            body=$(curl -fsS -m 58 -H "Authorization: Bearer $CRON_SECRET" "$base/api/cron/scan")
            echo "$body"
            echo "$body" | grep -q '"blocked":true' && exit 0
            sleep 3
          done
